<script>
/* Android app helpers: give the page native versions of two browser features
   that Android's in-app browser does not reliably provide. */
(function () {
  var A = window.NFTAndroid;
  if (!A) return;

  /* Cook-along "keep the screen on": route the Screen Wake Lock API to Android. */
  try {
    var held = 0;
    var wakeLock = {
      request: function () {
        held++;
        A.keepScreenOn(true);
        var released = false;
        var sentinel = {
          type: "screen",
          get released() { return released; },
          onrelease: null,
          addEventListener: function () {},
          removeEventListener: function () {},
          release: function () {
            if (!released) {
              released = true;
              held = Math.max(0, held - 1);
              if (!held) A.keepScreenOn(false);
            }
            return Promise.resolve();
          }
        };
        return Promise.resolve(sentinel);
      }
    };
    Object.defineProperty(navigator, "wakeLock", { value: wakeLock, configurable: true });
  } catch (e) {}

  /* "Copy" buttons (for example spending as CSV): use Android's clipboard. */
  try {
    var writeText = function (text) {
      return A.copyText(String(text)) ? Promise.resolve() : Promise.reject(new Error("Copy failed"));
    };
    var done = false;
    if (navigator.clipboard) {
      try { navigator.clipboard.writeText = writeText; done = navigator.clipboard.writeText === writeText; } catch (e) {}
    }
    if (!done) Object.defineProperty(navigator, "clipboard", { value: { writeText: writeText }, configurable: true });
  } catch (e) {}
})();
</script>

<style>
/* Layout: phone-first meal app in the Cap and Gown design (as DG20 XAB Care Log): a sticky top bar,
   white cards on a soft grey-blue background, one blue accent, Sora headings and Manrope text, a bottom tab

:root{
  --bg:#E9EDF4; --surface:#FFFFFF; --surface-2:#F4F6FA; --line:#DEE3EC;
  --fg:#111A2E; --muted:#5A6580; --faint:#8A93A8;

  --leaf:#3454D9; --leaf-ink:#FFFFFF; --jollof:#D0582B; --plantain:#D9921F; --plantain-ink:#FFFFFF;
  --good:#17905F; --warn:#B87700; --bad:#C93C55;
  --display:"Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:18px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#080C17; --surface:#121A2C; --surface-2:#19223A; --line:#263150;
  --fg:#E9EDF7; --muted:#9AA5BF; --faint:#6E7A96;
  --accent:#7F98FF; --accent-ink:#0B1020; --accent-text:#7F98FF; --accent-soft:#1E2950;
  --leaf:#7F98FF; --leaf-ink:#0B1020; --jollof:#F08A5D; --plantain:#F0B65A; --plantain-ink:#2B1F00;
  --good:#3CC48F; --warn:#E6AA35; --bad:#F27189; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#080C17; --surface:#121A2C; --surface-2:#19223A; --line:#263150;
  --fg:#E9EDF7; --muted:#9AA5BF; --faint:#6E7A96;
  --accent:#7F98FF; --accent-ink:#0B1020; --accent-text:#7F98FF; --accent-soft:#1E2950;
  --leaf:#7F98FF; --leaf-ink:#0B1020; --jollof:#F08A5D; --plantain:#F0B65A; --plantain-ink:#2B1F00;
  --good:#3CC48F; --warn:#E6AA35; --bad:#F27189; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5;margin:0}

.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 10px}
.brand{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}

.cycle{font-size:.85rem;color:var(--muted)}

nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 .9rem var(--body);padding:8px 14px;border-radius:999px;cursor:pointer}

button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--plantain);outline-offset:2px}
h2{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:0 0 8px;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:1rem;margin:0 0 6px}
.note{font-size:.85rem;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

/* shop / freezer */
.cat{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);margin:14px 0 2px}
/* Folding sections in More: only the title shows until it is tapped */
.foldhd{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0;margin:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}

.foldct{flex:none;font-size:.8rem;font-weight:600;color:var(--muted)}
.foldgrp.alldone .foldct{color:var(--good)}
.foldbd{display:none}
.fold.open>.foldbd{display:block;margin-top:8px}
.foldgrp{border-top:1px solid var(--line);margin-top:6px}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted)}

.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:10px}

const FULL = {
stew_rice:["Rinse {chickenwhole} and put it in a large pot with {onion*0.3} (sliced), {thyme*0.5} and {curry*0.5}. Add {w:150} water, cover and boil on medium.|25","Meanwhile blend {tomtin}, {redpepper}, {onion*0.5} and {scotchbonnet} until smooth. For a mild children's pot, blend the scotch bonnet separately.","Take out the chicken and keep the stock. Air-fry or grill the chicken at 200°C until golden.|15","Heat {oil} in a deep pan on medium. Add {onion*0.2} (chopped) and fry until soft.|3","Stir in {tompuree}.|2","Pour in the blended pepper. Fry with the lid half on, stirring every few minutes, until the oil rises to the top and it no longer tastes sour.|25","While the stew fries: rinse {rice} until the water runs clear. Cook in {w:180} water, lid on, on low.|20","Add half the chicken stock, {bayleaf} and the rest of the thyme and curry to the stew. Simmer.|10","Spoon out the children's stew now. Then add {stockcube} and the chicken to the adults' pot.|5","Peel {plantain}: cut off both ends, slit the skin and peel. Slice diagonally 1 cm thick.","Air-fry the plantain at 200°C, turning halfway, until golden.|12","Warm {peas} in boiling water.|3","Serve rice, stew and chicken, dodo and peas. Cool the children's plates."],
beans_dodo:["Pick through {honeybeans} for stones, then rinse well.","Boil the beans in plenty of water.|15","Drain and throw away the water (this helps with wind). Cover with fresh water and cook until very soft, topping up the water.|45","Or use a pressure cooker: 25 minutes, then let the pressure drop naturally.","Agoyin sauce for the adults: blend {redpepper}, {scotchbonnet} and half the {onion}. Slice the rest of the onion.","Heat {palmoil} on low until it thins (don't let it smoke). Fry the sliced onion until dark brown.|10","Add the blended pepper and {crayfish}. Fry on low, stirring, until dark and oily.|20","Mash the beans a little with a wooden spoon.","Peel and slice {plantain} and air-fry at 200°C.|12","Slice {cucumber} and {tomato}. Serve the beans with sauce on top for adults and plain for the children."],
efo_eba:["Wash {beef}, put in a pot with a little onion and {w:100} water. Boil until tender.|35","Blend {redpepper}, {scotchbonnet} and {onion} roughly (a bit chunky is good).","Grill or bake {mackerel} at 200°C until it flakes.|12","Heat {palmoil} in a pot on medium for 1 minute.|1","Add the pepper blend and fry, stirring, until the water dries up and it looks oily.|15","Add {crayfish}, {iru}, the beef and its stock. Simmer.|8","Take the children's portion out before adding salt or seasoning cube to the rest.","Wash and chop {spinach}. Squeeze out water and stir in. Cook until just wilted.|3","Flake in the mackerel, checking for bones.","Eba: boil {w:180} water. Take off the heat, sprinkle in {garri} and leave it to swell.|1","Stir hard with a wooden spoon until smooth, adding a splash of hot water if stiff. Shape into balls and serve with the efo."],

suya_wraps:["Cut {chicken} into strips. Toss with {suyaspice} and {oil}. Leave for at least 15 minutes.|15","Air-fry at 200°C, shaking halfway, until cooked through with charred edges.|15","Peel and slice {plantain}; air-fry in a second batch.|12","Slice {redonion} and {tomato} thin and shred {cabbage}.","Warm {wraps} in a dry pan for 20 seconds per side.","Fill with chicken, plantain, salad and a spoon of {yoghurt}. Roll tightly."],

suya_burgers:["Mix {chickenmince}, {suyaspice}, {onion} (grated) and {breadcrumbs}. Shape into patties.","Chill for 15 minutes so they hold.|15","Peel {yam} and cut into fries. Toss with {oil}. Air-fry at 200°C.|18","Air-fry the patties at 190°C, turning once, until cooked through.|14","Toast {buns}. Add {lettuce} and {tomato}."],
naija_tapas:["Fish rolls: follow the fish roll recipe with {flour}, {butter} and {sardinetin}.","Boil {gizzard} until tender.|25","Cut {goat} small, boil until tender.|40","Air-fry gizzards, goat and diced {plantain} at 200°C.|12","Fry blended {redpepper}, {scotchbonnet} and {onion}. Toss half the meat in it for the adults.|8","Cut {cucumber} and {carrot} into sticks."],
banga_rice:["Open {palmfruit} and stir with {w:150} hot water.","Boil, stirring, until it thickens and oil rises.|20","Add {bangaspice}, {crayfish}, {onion} and {scotchbonnet}.|5","Add {croaker} steaks and {smokedmack}. Simmer gently without stirring.|10","Finish with {scentleaf}.","Cook {rice} in {w:180} water, lid on, on low.|20"],
fried_rice:["Cut {chicken} into pieces and season with {curry}. Air-fry.|15","Rinse {basmati}. Boil in water for 8 minutes, then drain (it should still be firm).|8","Dice {carrot}, {greenbeans} and {onion}.","Heat {oil} in a wok. Fry the onion, then add carrot and beans.|4","Add {sweetcorntin}, {peas}, {thyme} and the rest of the curry.|2","Add the rice and {w:30} stock with {stockcube} (after taking the children's portion out). Toss until dry and hot.|6","Serve with the chicken."],
beans_porridge:["Pick and rinse {honeybeans}. Boil, drain, add fresh water and cook until soft.|45","Blend {redpepper}, {onion} and {scotchbonnet}.","Peel and chop {plantain} into chunks.","Add pepper, {palmoil}, {crayfish} and plantain to the beans. Simmer until the plantain is soft and the porridge is thick.|15"],
edikaikong:["Boil {beef} with a little onion until tender.|35","Wash and finely chop {ugu} and {kale}.","Heat {palmoil}, add {onion}, the beef and stock, {smokedmack}, {crayfish} and {scotchbonnet}. Simmer.|8","Add the kale first (it takes longer), then the ugu. Stir and cook without a lid.|6","Poundo: boil {w:200} water, stir in {poundo} until smooth.|3"],
yamarita_night:["Peel {yam}, cut into batons and boil until just soft.|10","Drain and cool for 2 minutes.","Dip in beaten {eggs*0.5} then {flour}. Air-fry at 200°C until golden.|12","Egg sauce: fry chopped {onion}, {tomato} and {redpepper} in {oil}.|4","Add the rest of the eggs, beaten. Stir until fully set.|3","Make a salad with {lettuce} and {cucumber}."],
suya_bowls:["Cut {chicken} into strips, toss with {suyaspice} and {oil}.","Air-fry at 200°C until cooked.|15","Cook {rice} in {w:160} water, lid on, on low.|20","Shred {cabbage}, slice {tomato} and {redonion}.","Build bowls and squeeze over {lime}."],
party_platter:["Make jollof with {rice}, {tomtin}, {redpepper} and {onion} (see the jollof bowls method) and cool it completely.|60","Wet your hands, roll balls of jollof around cubes of {mozzarella}.","Roll in beaten {eggs} then {breadcrumbs}. Bake at 200°C.|20","Slice {greenplantain} very thin, toss with oil, bake until crisp.|15","Top the chips with warm {bebeans}, chopped {tomato} and {cheese}. Grill.|3","Toss {wings} with {oil} and air-fry at 200°C.|22"],
native_jollof:["Blend {redpepper}, {onion} and {scotchbonnet} roughly.","Heat {palmoil} on low for 1 minute.|1","Add the blend, {crayfish} and {iru}. Fry.|10","Add rinsed {rice} and {w:200} water. Lid on, low heat.|25","Flake in {smokedmack} and add {spinach} and {scentleaf}. Cover.|5"],
pap_akara:["Akara: blend {peeledbeans} with {onion} and very little water. Whisk until light and fluffy.|5","Shallow-fry spoonfuls in {oil}, turning once, until golden.|4","Pap: mix {ogi} with a little cold water to a smooth paste.","Pour on just-boiled water, stirring fast, until it thickens. Loosen with {milk}.","Mash {banana} into the children's pap."],
oats_banana:["Put {oats} and {milk} in a pan.","Simmer, stirring, until creamy.|5","Top with sliced {banana} and {berries}."],
frittata_toast:["Peel and dice {plantain}. Fry in a little oil until golden.|5","Beat {eggs} with chopped {onion} and {redpepper}.","Pour over the plantain. Cook on low until almost set.|5","Finish under the grill until puffed.|2","Toast {bread} and spread {butter}."],
overnight_oats:["The night before: mix {oats}, {milk} and {yoghurt} in jars. Lid on, into the fridge.","In the morning, top with {mango}."],
bread_egg:["Chop {onion}, {tomato} and {redpepper}.","Fry in {oil} until soft.|3","Pour in beaten {eggs}. Stir gently until fully set.|3","Serve with {bread}."],
yam_egg_b:["Peel {yam}, cut into slices and boil until a knife goes in easily.|18","Egg sauce: fry chopped {onion}, {tomato} and {redpepper} in {oil}.|4","Add beaten {eggs}. Stir until set.|3"],
moimoi_custard:["Steam moi moi from the freezer (or follow the moi moi method with {peeledbeans}, {redpepper}, {onion} and {oil}).|20","Custard: mix {custardpowder} with a splash of {milk} into a paste.","Heat the rest of the milk until steaming, pour over the paste, stir until thick.|3"],
masa_b:["The night before: soak {rice} in water.","Blend the rice with {yeast}, {milk} and a little water to a thick batter. Leave overnight to rise.","Heat a pan with a little {oil}. Drop in spoonfuls of batter.","Cook until set, then turn.|2","Cook the other side.|2","Serve with {banana} and {pawpaw}."],
asaro:["Peel {yam} and cut into chunks.","Put in a pot with water just covering it. Boil.|10","Blend {redpepper}, {onion} and {scotchbonnet}. Add with {palmoil} and {crayfish}.","Simmer until the yam is very soft.|10","Mash about half the yam into the sauce.","Stir in {spinach} and flaked {smokedmack}.|3"],
jollof_spag:["Blend {tomtin}, {redpepper} and {onion}.","Fry in {oil} with {tompuree} and {curry} until the oil rises.|15","Add {w:200} water and bring to the boil.","Break in {spaghetti}. Cook, stirring, until soft and the sauce is absorbed.|12","Stir in shredded {chicken} and {peas}.|3"],
akara_bread:["Blend {peeledbeans} with {onion} and {scotchbonnet} and very little water. Whisk until fluffy.|5","Shallow-fry spoonfuls in {oil}, turning, until golden.|4","Pap: mix {ogi} with cold water, pour on boiling water, stir until thick. Loosen with {milk}.","Serve akara in {bread}."],
plantain_porridge:["Peel {greenplantain} and cut into chunks.","Boil in water just covering it.|10","Add blended {redpepper}, {onion}, {palmoil} and {crayfish}. Simmer until soft and thick.|15","Add flaked {smokedmack} and {spinach}.|5"],
rice_beans:["Boil {bebeans} until nearly soft.|35","Add rinsed {rice} and water to cover by 2 cm. Cook, lid on.|20","Fry blended {tomtin}, {redpepper} and {onion} in {oil} until the oil rises.|20","Boil {eggs}.|9"],
noodle_egg:["Cook {spaghetti} or noodles in boiling water.|4","Fry {onion}, {carrot}, {cabbage} and {redpepper} in {oil} with {curry}.|4","Add the noodles, then push to the side and scramble {eggs}.|2"]
};

function equipFor(r,id){
  const txt=(r.full||[]).concat(r.steps||[]).join(" ");const set=new Set(["knife","scales"]);
  if(r.ing.some(([i])=>ING[i]&&ING[i].unit==="tsp"))set.add("spoons");

function cycleIndex(date){
  const start=mondayOf(parse(S.settings.start||"2026-11-23"));
  const diff=Math.round((mondayOf(date)-start)/(7*864e5));

}

/* which recipe sits in a slot on a date ("left" for weekday leftovers, null for none) */
function slotFor(date,slot){
  const k=ymd(date),sw=swapsFor(k);
  if(sw[slot]&&(sw[slot]==="left"||RECIPES[sw[slot]])) return {id:sw[slot],swapped:true};
  const w=weekOf(date),di=(date.getDay()+6)%7;
  if(slot==="S2"){
    if(di<5){if(S.settings.smartSnack!==false&&(di===1||di===3))return {id:"fruit_pot",swapped:false};return {id:w.bake[di%2],swapped:false}}
    const wk=S.weeks[ymd(mondayOf(date))]||{};
    return {id:(wk.bake&&RECIPES[wk.bake])?wk.bake:w.weekendBake,swapped:!!wk.bake};
  }
  if(slot==="N"){if(S.settings.nightOn===false)return null;const id=w.N[di];return id?{id,swapped:false}:null}
  const wa=weekAbs(date);
  if(slot==="D"){const wn=S.settings.world==null?1:+S.settings.world;if((wn>=1&&di===3)||(wn>=2&&di===1)){return {id:WORLD[(wa*2+(di===3?0:1))%WORLD.length],swapped:false,world:true}}}
  if(slot==="L"&&di===5&&S.settings.saladSat!==false)return {id:SALADS[((wa%SALADS.length)+SALADS.length)%SALADS.length],swapped:false};
  return {id:w[slot][di],swapped:false};
}
const guestsOn=k=>(S.days[k]||{}).guests||0;
/* portions (adult portions) for a meal slot */
function portionsFor(date,slot){
  const k=ymd(date),g=guestsOn(k),s=slotFor(date,slot);
  if(!s||s.id==="left")return 0;
  if(slot==="B"||slot==="S1")return famF();
  if(slot==="L")return famF()+g;
  if(slot==="N")return adultF()+g;
  if(slot==="D"){
    let p=famF()+g;
    const nx=slotFor(addDays(date,1),"L");
    if(nx&&nx.id==="left"){const lf=S.settings.lunchFor||"adults";p+=lf==="all"?famF():lf==="adults"?adultF():0}
    return p;
  }
  return 0;
}
/* bakes are made in batches: how many batches are needed this week for each bake */
function bakePlan(mon){
  const plan={};const ppd=piecesPerDay();
  for(let i=0;i<7;i++){const d=addDays(mon,i),s=slotFor(d,"S2");if(!s)continue;
    const r=RECIPES[s.id];if(!r.batch)continue;const p=plan[s.id]||(plan[s.id]={pieces:0,days:[]});
    p.pieces+=(i>=5?ppd*1.5:ppd)+(i>=5?guestsOn(ymd(d))*2:0);p.days.push(i)}
  for(const [id,p] of Object.entries(plan)){const r=RECIPES[id];const ov=(S.weeks[ymd(mon)]||{}).mult||{};
    p.mult=ov[id]||Math.max(0.5,Math.ceil(2*p.pieces/r.batch)/2)}
  return plan;
}

/* ---------- Swap picker ---------- */
function swapScore(id,d,s){
  const r=RECIPES[id];let sc=Math.random()*1.5;const why=[];const k=ymd(d);
  const hr=new Date().getHours();const isToday=k===ymd(todayD());
  const quick=r.mins<=30;
  if(s==="D"||s==="L"){if(isToday&&hr>=15&&quick){sc+=3;why.push("Ready in "+r.mins+" min")}else if(quick){sc+=1;why.push(r.mins+" min")}else why.push(r.mins+" min")}
  else why.push(r.mins+" min");
  if((s==="D"||s==="L")&&r.mins>60){const wk=d.getDay()>=1&&d.getDay()<=5;sc-=(isToday&&hr>=14)?6:wk?3:0.5}
  if(s!=="S2"&&s!=="N"){const tg=tagsOf(id);if(tg.veg){sc+=0.6;why.push("Veg-rich")}if(tg.oily){sc+=0.5;why.push("Oily fish")}if(tg.fried)sc-=0.6;
    const cc=recipeCost(r,famF());if(S.cheap&&(s==="D"||s==="L")){const cur=slotFor(d,s);const c0=cur&&RECIPES[cur.id]?recipeCost(RECIPES[cur.id],famF()):cc;if(cc<c0*0.8){sc+=3;why.unshift("Saves about "+money(c0-cc))}else sc-=2}}
  const fz=Object.values(S.freezer).find(f=>r.bag&&f.name&&f.name.toLowerCase().includes(r.bag.toLowerCase().slice(0,10)));
  if(fz){sc+=4;why.unshift("Already in your freezer")}
  const st=Object.entries(S.days).filter(([dk,v])=>v.stars&&slotFor(parse(dk),"D").id===id).map(([,v])=>v.stars);
  if(st.length){const a=st.reduce((x,y)=>x+y,0)/st.length;sc+=a-2.5;if(a>=4)why.push("Family rated "+a.toFixed(1)+"★")}
  for(let b=1;b<=10;b++){const dd=addDays(d,-b);if(slotFor(dd,s)&&slotFor(dd,s).id===id){sc-=4;break}}
  const mon=mondayOf(d);for(let x=0;x<7;x++){const dd=addDays(mon,x);if(ymd(dd)!==k&&slotFor(dd,s)&&slotFor(dd,s).id===id){sc-=3;break}}
  const cur=slotFor(d,s);if(cur&&RECIPES[cur.id]&&RECIPES[cur.id].cuisine!==r.cuisine){sc+=0.8;why.push("Something different: "+CUISINE[r.cuisine])}
  if(S.settings.noPeanut&&r.ing.some(([i])=>i==="peanutbutter"||i==="suyaspice"))sc-=10;
  return {id,sc,why};
}
function swapPicker(){

  if(!S.swapSeed||S.swapSeed.k!==k+s){S.swapSeed={k:k+s,list:Object.keys(RECIPES).filter(i=>SLOTCAT[s].includes(RECIPES[i].cat)&&(!cur||i!==cur.id)).map(i=>swapScore(i,d,s)).sort((a,b)=>b.sc-a.sc)};
    const g={};for(const o of S.swapSeed.list)(g[RECIPES[o.id].cuisine]=g[RECIPES[o.id].cuisine]||[]).push(o);
    const order=Object.keys(g).sort((x,y)=>g[y][0].sc-g[x][0].sc);const mixed=[];
    while(order.some(c=>g[c].length))for(const c of order)if(g[c].length)mixed.push(g[c].shift());
    S.swapSeed.list=mixed}

  const opt=o=>{const r=RECIPES[o.id];return `<button class="opt" data-act="doswap" data-k="${k}" data-s="${s}" data-id="${o.id}">${thumb(r,s==="N"?"night":"")}<span><b>${esc(r.n)}</b><small>${esc(o.why.slice(0,3).join(" · "))}</small></span></button>`};

   <div class="picker">${list.filter(o=>(S.swapCuisine||"all")==="all"||RECIPES[o.id].cuisine===S.swapCuisine).map(o=>`<button data-act="doswap" data-k="${k}" data-s="${s}" data-id="${o.id}"><b>${esc(RECIPES[o.id].n)}</b><small>${RECIPES[o.id].mins} min · ${esc(CUISINE[RECIPES[o.id].cuisine])}</small></button>`).join("")}</div>`:"";

/* ---------- Planner ---------- */
function viewWeek(){
  const t=todayD();const mon=addDays(mondayOf(t),7*S.weekOffset);const mk=ymd(mon);const w=weekOf(mon);const ci=cycleIndex(mon);const wk=S.weeks[mk]||{};
  const days=[0,1,2,3,4,5,6].map(i=>{const d=addDays(mon,i),k=ymd(d),rec=S.days[k]||{};const din=slotFor(d,"D");const g=guestsOn(k);
    const open=S.open===k;
    const slots=SLOTS.map(sl=>{const s=slotFor(d,sl.k);if(!s)return "";
      const name=s.id==="left"?"Leftover "+RECIPES[leftoverSource(d)].n:RECIPES[s.id].n;
      const p=sl.k==="S2"||s.id==="left"?"":pname(portionsFor(d,sl.k));
      return `<span class="k">${esc(sl.n)}</span><span>${s.id==="left"?esc(name):`<button class="linkbtn" data-act="recipe" data-id="${s.id}" data-k="${k}" data-s="${sl.k}">${esc(name)}</button>`}${s.swapped?' <span class="pill soon">swapped</span>':""}${p?` <span class="note">· ${p}</span>`:""}</span><button class="btn small" data-act="openswap" data-k="${k}" data-s="${sl.k}">Swap</button>`}).join("");
    return `<div class="planday ${k===ymd(t)?"today":""}">
      <div class="top" data-act="toggleday" data-k="${k}"><div><div class="note" style="font-weight:700">${esc(fmtShort(d))}${rec.cooked?" · ✓ cooked":""}${g?" · "+g+" guest"+(g>1?"s":""):""}</div><div class="mname" style="font-family:var(--display);font-weight:700">${esc(RECIPES[din.id].n)}</div><div class="note">🍎 ${esc(ITEMS[fruitFor(d)].n)}</div></div><span class="note">${open?"Hide":"All meals"}</span></div>
      ${open?`<div class="slots">${slots}<span class="k">Fruit of the day</span><span><button class="linkbtn" data-act="info" data-id="${fruitFor(d)}">${esc(ITEMS[fruitFor(d)].n)}</button></span><button class="btn small" data-act="fruitswap" data-k="${k}" ${W()}>Change</button></div><div class="row" style="margin-top:10px"><span class="note">Guests at meals this day</span><span class="stepper"><button data-act="guest" data-k="${k}" data-d="-1" ${W()} aria-label="Fewer guests">−</button><b>${g}</b><button data-act="guest" data-k="${k}" data-d="1" ${W()} aria-label="More guests">+</button></span></div>`:""}
    </div>`}).join("");
  const prep=w.prep.map((p,i)=>{const on=!!(wk.prep||{})[i];return `<label class="check ${on?"done":""}"><input type="checkbox" data-act="prep" data-w="${mk}" data-i="${i}" ${on?"checked":""}><span>${esc(p)}</span></label>`}).join("");

  return `<div class="stack">

  <div class="row">${S.weekOffset>0?`<button class="btn small" data-act="wk" data-d="-1">‹ Prev</button><button class="btn small" data-act="wk" data-d="0">This week</button>`:`<button class="btn small" data-act="gohist" data-v="weeks">Past weeks</button>`}${S.weekOffset<3?`<button class="btn small" data-act="wk" data-d="1">Next ›</button>`:""}</div></div>
  ${S.swap?swapPicker():""}
  <div class="stack" style="gap:8px">${days}</div>
  ${balancePanel(mon)}
  <section class="panel"><h2>Sunday prep (about 2 hours)</h2><p class="note">Done the Sunday before this week starts. Ticks are shared with your partner.</p>${prep}</section>
  <section class="panel"><h2>This week's bakes</h2>${Object.entries(bp).map(([id,p])=>`<div class="kidrow"><span><button class="linkbtn" data-act="recipe" data-id="${id}" data-mult="${p.mult}">${esc(RECIPES[id].n)}</button> <span class="note">· ${p.days.map(i=>DAYN[i]).join(", ")}</span></span><span class="note">${nice(p.mult)}× batch, about ${Math.round(RECIPES[id].batch*p.mult)} pieces</span></div>`).join("")}<p class="note">Batch sizes follow how many people are in the family. Change the weekend treat on the Pastries tab.</p></section></div>`;
}

/* ---------- Shopping ---------- */
function viewShop(){
  const t=todayD();let base=mondayOf(t);if(((t.getDay()+6)%7)>=5&&S.shopNext!==false)base=addDays(base,7);
  const mon=addDays(base,7*(S.shopOffset||0));const mk=ymd(mon);const items=shopList(mon);const ticks=(S.weeks[mk]||{}).shop||{};const extras=(S.weeks[mk]||{}).extra||{};
  const ids=Object.keys(items);const done=ids.filter(i=>ticks[i]).length+Object.values(extras).filter(e=>e.done).length;const total=ids.length+Object.keys(extras).length;
  const groups=AISLES.map(a=>{const list=ids.filter(i=>ING[i].aisle===a).sort((x,y)=>ING[x].n.localeCompare(ING[y].n));if(!list.length)return "";
    return `<div class="cat">${esc(a)}${AISLE_TIP[a]?` <span style="text-transform:none;letter-spacing:0;font-weight:500">· ${esc(AISLE_TIP[a])}</span>`:""}</div>`+list.map(i=>{const it=items[i],g=ING[i],on=!!ticks[i];
      const warn=g.fr&&g.fr<it.first+2?`<div class="use" style="color:var(--warn)">Keeps about ${g.fr} day${g.fr>1?"s":""}: first needed ${DAYL[it.first]}. ${g.unit==="g"&&/Meat|fish/.test(g.aisle)?"Freeze on the day you buy it.":"Buy fresh midweek, or use the frozen kind."}</div>`:"";
      return `<label class="shopitem ${on?"done":""}"><input type="checkbox" data-act="shop" data-w="${mk}" data-key="${i}" ${on?"checked":""}><span><span class="nm">${esc(g.n)}</span>${g.alt?`<div class="use">If you can't get it: ${esc(g.alt)}</div>`:""}<div class="use">For ${esc(it.uses.slice(0,4).join(", "))}${it.uses.length>4?" and "+(it.uses.length-4)+" more":""}</div>${warn}</span><span class="qty">${qty(i,it.q)}${esc(packHint(i,it.q))}<small class="price">${packsFor(i,it.q)} × ${esc(priceOf(i).lab||"pack")} · ${money(lineCost(i,it.q))}</small></span></label>`}).join("")}).join("");
  const wc=weekCost(mon);const sp=spentFor(mk);
  const ex=Object.entries(extras).map(([id,e])=>`<label class="shopitem ${e.done?"done":""}"><input type="checkbox" data-act="extra" data-w="${mk}" data-id="${id}" ${e.done?"checked":""}><span class="nm">${esc(e.name)}</span><button class="btn small" data-act="delextra" data-w="${mk}" data-id="${id}" aria-label="Remove">×</button></label>`).join("");
  return `<div class="stack"><section class="panel">
    <div class="weekhead"><div><h2>Shopping for ${esc(fmtShort(mon))} to ${esc(fmtShort(addDays(mon,6)))}</h2><div class="note">Week ${cycleIndex(mon)+1}: ${esc(weekOf(mon).name)} · ${total} items · ${done} ticked</div></div>
    <div class="row"><button class="btn small" data-act="shopwk" data-d="-1">‹ Prev</button><button class="btn small" data-act="shopwk" data-d="1">Next ›</button></div></div>
    <div class="progress" style="margin-top:10px"><i style="width:${total?Math.round(done/total*100):0}%"></i></div>
    <div class="stats" style="margin-top:10px"><div class="stat"><b>${money0(wc.fresh)}</b><small>Weekly shop, estimated</small></div><div class="stat"><b>${money0(wc.cup)}</b><small>Cupboard items, if you've run out</small></div><div class="stat"><b>${money0(wc.ticked)}</b><small>Ticked so far</small></div>${sp?`<div class="stat"><b>${money(sp)}</b><small>Recorded spend</small></div>`:""}</div>
    <div class="row" style="margin-top:8px"><button class="btn small" data-act="spticked" data-w="${mk}">Log ticked items as a purchase</button><button class="btn small" data-act="spopen">Log a receipt</button><button class="btn small" data-act="goto" data-v="money">See Costs</button>${budget()&&wc.fresh>budget()?`<span class="pill soon">About ${money0(wc.fresh-budget())} over budget</span>`:""}</div>
    <p class="note">Every ingredient in every meal, snack, bake, night bite and drink this week, added up for ${members().length} people${Object.keys(S.days).some(k=>parse(k)>=mon&&parse(k)<addDays(mon,7)&&guestsOn(k))?" plus guests":""}. Shop on Saturday, prep on Sunday. Tick what you already have.</p>
    ${groups}
    <div class="cat">Your extras</div>${ex||`<p class="note">Nappies, wipes, washing-up liquid: add anything else here.</p>`}
    <form class="add" id="extraForm" data-w="${mk}" style="grid-template-columns:1fr auto"><label class="f">Add an item<input type="text" id="extraName" placeholder="e.g. Nappies size 5"></label><button class="btn primary" type="submit" ${W()}>Add</button></form>
  </section></div>`;
}

/* ---------- Fridge ---------- */
function viewFridge(){
  const t=todayD();const rows=[];
  for(let back=2;back>=0;back--){const d=addDays(t,-back),k=ymd(d);const s=slotFor(d,"D");const r=RECIPES[s.id];if(!r.keep)continue;
    if(back===0&&!(S.days[k]||{}).cooked)continue;
    const dl=dayDiff(addDays(d,r.keep),t);if(dl<0)continue;
    rows.push([`Leftover ${r.n}`,`Cooked ${back===0?"tonight":back===1?"yesterday":DAYL[(d.getDay()+6)%7]}`,dl,/rice|jollof/i.test(r.n)?"Rice: cool within 1 hour, keep 1 day, reheat once":"Reheat once until steaming"])}
  const mon=mondayOf(t);const bp=bakePlan(mon);
  for(const [id,p] of Object.entries(bp)){const r=RECIPES[id];if(p.days[0]>=5)continue;const made=addDays(mon,-1);const dl=dayDiff(addDays(made,r.keep),t);if(dl>=0)rows.push([r.n,`Baked on Sunday`,dl,r.frz?`Keep ${r.keep} days in a tub. Freeze the rest on Sunday and take one day's worth out each night.`:"Keep in an airtight tub"])}
  const tm=addDays(t,1),tmD=RECIPES[slotFor(tm,"D").id];
  const defrost=tmD.bag&&!/^(Nothing|Slow cooker|Cooked)/.test(tmD.bag)?`<div class="alert"><b>Tonight:</b> move "${esc(tmD.bag)}" from the freezer to the bottom shelf of the fridge for tomorrow's ${esc(tmD.n)}. Use within 24 hours of defrosting.</div>`:"";
  const items=shopList(mon);const fresh=Object.keys(items).filter(i=>ING[i].fr>0&&ING[i].fr<=7).map(i=>({i,first:items[i].first,fr:ING[i].fr})).sort((a,b)=>a.first-b.first||a.fr-b.fr);
  const freshRows=fresh.map(x=>{const g=ING[x.i];const risky=x.fr<x.first+2;return `<tr><td>${esc(g.n)}</td><td>${DAYN[x.first]}</td><td class="num">${x.fr} day${x.fr>1?"s":""}</td><td>${risky?`<span class="pill soon">${/Meat and fish/.test(g.aisle)?"Freeze when you get home":"Buy midweek or use frozen"}</span>`:`<span class="pill ok">Fridge is fine</span>`}</td></tr>`}).join("");
  const log=Object.entries(S.fridge).map(([id,f])=>({id,...f,dl:dayDiff(addDays(parse(f.added),f.days),t)})).sort((a,b)=>a.dl-b.dl);
  const logRows=log.map(f=>`<tr><td>${esc(f.name)}<div class="note">${esc((FRIDGE_TYPES[f.type]||FRIDGE_TYPES.other)[0])} · in ${esc(fmtShort(parse(f.added)))}</div></td><td>${pill(f.dl,eatByLabel(f.dl))}</td><td><div class="row"><button class="btn small" data-act="frEat" data-id="${f.id}" ${W()}>Eaten</button>${f.type!=="defrost"&&f.type!=="rice"?`<button class="btn small" data-act="frFreeze" data-id="${f.id}" ${W()}>Freeze</button>`:""}</div></td></tr>`).join("");
  return `<div class="stack">
  <section class="panel"><h2>Eat these soon</h2><p class="note">Worked out from what you cooked. NHS advice: eat leftovers within 2 days, cooked rice within 1 day, and reheat only once.</p>
   ${defrost}
   ${rows.length?`<div class="tablewrap"><table><thead><tr><th>Food</th><th>When</th><th>Eat by</th></tr></thead><tbody>${rows.map(([n,w,dl,tip])=>`<tr><td>${esc(n)}<div class="note">${esc(tip)}</div></td><td>${esc(w)}</td><td>${pill(dl,eatByLabel(dl))}</td></tr>`).join("")}</tbody></table></div>`:`<p class="note">Nothing from the plan is waiting. Mark dinner as cooked on Today and its leftovers appear here.</p>`}</section>
  <section class="panel"><h2>Also in the fridge</h2>${logRows?`<div class="tablewrap"><table><thead><tr><th>Food</th><th>Eat by</th><th></th></tr></thead><tbody>${logRows}</tbody></table></div>`:`<p class="note">Add an opened tin, a fresh pepper blend or anything else you want reminding about.</p>`}
   <form class="add" id="frForm"><label class="f">What is it?<input type="text" id="frName" placeholder="e.g. Half tin of tomatoes"></label><label class="f">Type<select id="frType">${Object.entries(FRIDGE_TYPES).map(([k,[n,d]])=>`<option value="${k}">${esc(n)} (${d} day${d>1?"s":""})</option>`).join("")}</select></label><label class="f">Went in<input type="date" id="frDate" value="${ymd(t)}"></label><button class="btn primary" type="submit" ${W()}>Add</button></form></section>
  <section class="panel"><h2>Fresh food from this week's shop</h2><p class="note">Short-life items and the first day the plan needs them, if you shop on Saturday.</p><div class="tablewrap"><table><thead><tr><th>Item</th><th>First used</th><th class="num">Keeps</th><th>Plan</th></tr></thead><tbody>${freshRows}</tbody></table></div></section>
  <section class="panel"><h3>Fridge rules</h3><ol class="steps"><li>Keep the fridge at 0 to 5°C. Check it with a fridge thermometer.</li><li>Raw meat and fish go on the bottom shelf, in a covered tub.</li><li>Cool cooked food within 1 to 2 hours, then fridge it. Rice within 1 hour.</li><li>Move opened tins into a lidded tub.</li><li>When in doubt, throw it out. Don't taste food to check it.</li></ol></section></div>`;
}

/* ---------- Freezer ---------- */
function viewFreezer(){
  const t=todayD();const mon=addDays(mondayOf(t),((t.getDay()+6)%7)===6?7:0);const mk=ymd(mon);const logged=(S.weeks[mk]||{}).fz||{};
  const plan=[];
  for(let i=0;i<5;i++){const d=addDays(mon,i),r=RECIPES[slotFor(d,"D").id];if(!r.frz||!r.bag||/^(Nothing|Slow cooker|Cooked)/.test(r.bag))continue;plan.push({key:"d"+i,name:r.bag,for:DAYL[i]+": "+r.n,months:Math.min(r.frz,3),portions:Math.max(1,Math.round(portionsFor(d,"D")))})}
  for(const [id,p] of Object.entries(bakePlan(mon))){const r=RECIPES[id];if(r.frz&&p.days[0]<5)plan.push({key:"b"+id,name:r.n,for:"Snacks from Wednesday on",months:r.frz,portions:Math.max(1,Math.round(r.batch*p.mult/2))})}
  const planRows=plan.map(p=>`<tr><td>${esc(p.name)}<div class="note">${esc(p.for)}</div></td><td class="num">${p.portions}</td><td>${p.months} mo</td><td>${logged[p.key]?`<span class="pill ok">Logged</span>`:`<button class="btn small" data-act="fzPlan" data-w="${mk}" data-key="${p.key}" data-name="${esc(p.name)}" data-p="${p.portions}" data-m="${p.months}" ${W()}>Log it</button>`}</td></tr>`).join("");
  const rows=Object.entries(S.freezer).map(([id,f])=>{const use=addDays(parse(f.frozen),Math.round((f.months||3)*30.4));return {id,...f,use,dl:dayDiff(use,t)}}).sort((a,b)=>a.dl-b.dl)
    .map(f=>`<tr><td>${esc(f.name)}<div class="note">Frozen ${esc(fmtShort(parse(f.frozen)))}</div></td><td><span class="stepper"><button data-act="fz" data-id="${f.id}" data-d="-1" ${W()} aria-label="Use one">−</button><b>${f.portions}</b><button data-act="fz" data-id="${f.id}" data-d="1" ${W()} aria-label="Add one">+</button></span></td><td>${pill(f.dl,f.dl<0?"Past its best":"Use by "+fmtShort(f.use))}</td></tr>`).join("");
  return `<div class="stack">
  <section class="panel"><h2>Freeze from Sunday prep</h2><p class="note">Week of ${esc(fmtShort(mon))}. Portions match your family. Tap Log it when the bag goes in and it moves to the list below with its use-by date.</p>
   ${planRows?`<div class="tablewrap"><table><thead><tr><th>Bag</th><th class="num">Portions</th><th>Keeps</th><th></th></tr></thead><tbody>${planRows}</tbody></table></div>`:`<p class="note">Nothing to freeze this week.</p>`}</section>
  <section class="panel"><h2>In the freezer now</h2>${rows?`<div class="tablewrap"><table><thead><tr><th>Bag</th><th>Portions</th><th>Use by</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<p class="note">Nothing logged yet.</p>`}
   <form class="add" id="fzForm"><label class="f">What is it?<input type="text" id="fzName" placeholder="e.g. Egusi soup"></label><label class="f">Portions<input type="number" id="fzPortions" min="1" value="2"></label><label class="f">Keeps for<select id="fzMonths"><option value="1">1 month</option><option value="2">2 months</option><option value="3" selected>3 months</option><option value="6">6 months</option></select></label><button class="btn primary" type="submit" ${W()}>Add</button></form></section>
  <section class="panel"><h2>How long things keep frozen</h2><p class="note">At −18°C food stays safe, but freezing only pauses germs; it doesn't kill them. These are the times for best quality and safe handling.</p><div class="tablewrap"><table><thead><tr><th>Food</th><th>Keep up to</th></tr></thead><tbody>${FREEZE_GUIDE.map(([a,b])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join("")}</tbody></table></div></section>
  <section class="panel"><h3>Freezer rules</h3><ol class="steps"><li>Freezer at −18°C. Cool food fully before freezing, but within 2 hours (rice within 1 hour).</li><li>Freeze flat in labelled bags with the name and date.</li><li>Defrost in the fridge overnight, never on the worktop. Use within 24 hours.</li><li>Reheat once until steaming hot all the way through, then cool before serving the children.</li><li>Never refreeze food that has been defrosted, unless you cook it first.</li><li>Don't freeze akara or puff puff batter, plantain frittata or egg dishes.</li></ol></section></div>`;
}

   <div class="drink"><b>Chapman</b><p class="note">The bar favourite with no alcohol: Fanta, Sprite, grenadine, cucumber and citrus. <button class="linkbtn" data-act="recipe" data-id="d_chapman">Recipe</button></p></div>

function viewFamily(){
  const ms=members();const F=famF();

    <label class="f">Appetite<select data-m="${i}" data-f="app">${Object.entries(APP).map(([k,g])=>`<option value="${k}" ${(m.app||"normal")===k?"selected":""}>${esc(g.n)}</option>`).join("")}</select></label>
    <button class="btn small" data-act="delmember" data-i="${i}" ${W()} ${ms.length<2?"disabled":""}>Remove</button></div>`).join("");
  const colors=["var(--leaf)","var(--jollof)","var(--plantain)","#5b8fd6","#9b6bd6","#d66b9b","#6bc0d6"];
  const bar=ms.map((m,i)=>`<i style="width:${fac(m)/F*100}%;background:${colors[i%colors.length]}" title="${esc(m.name)}"></i>`).join("");
  const legend=ms.map((m,i)=>`<span class="row" style="gap:4px"><i style="width:10px;height:10px;border-radius:3px;display:inline-block;background:${colors[i%colors.length]}"></i>${esc(m.name)} ${Math.round(fac(m)*100)/100}</span>`).join("");
  const t=todayD();const ex=[["rice","Rice for a rice dinner",90],["chickenwhole","Chicken on the bone",180],["beef","Stewing beef for soup",100],["yam","Yam",250],["garri","Garri for eba",90],["plantain","Ripe plantain",0.75]];
  const lf=S.settings.lunchFor||"adults";
  // stats
  const days=Object.entries(S.days),cooked=days.filter(([,r])=>r.cooked).length,rated=days.filter(([,r])=>r.stars);
  const avg=rated.length?(rated.reduce((s,[,r])=>s+r.stars,0)/rated.length).toFixed(1):"–";
  const per={};for(const [k,r] of days){const s=slotFor(parse(k),"D");if(!s)continue;const p=per[s.id]||(per[s.id]={stars:[],kids:{}});if(r.stars)p.stars.push(r.stars);for(const [kid,v] of Object.entries(r.kids||{}))if(v==="all"||v==="some")p.kids[kid]=(p.kids[kid]||0)+1}
  const favs=Object.entries(per).filter(([,p])=>p.stars.length).map(([id,p])=>[id,p.stars.reduce((a,b)=>a+b,0)/p.stars.length]).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const kids=kidsList();const learning=Object.entries(per).filter(([,p])=>Object.keys(p.kids).length);
  return `<div class="stack">
  <section class="panel"><h2>Who's eating</h2><p class="note">Everything in the app is sized from this list: every recipe, the shopping list, freezer bags and bake batches. Change it and the whole plan recalculates.</p>
   ${rows}<div class="row" style="margin-top:10px"><button class="btn" data-act="addmember" ${W()}>Add a person</button></div></section>
  <section class="panel"><h2>How much your family eats</h2>
   <div class="statrow"><div class="stat"><b>${Math.round(F*10)/10}</b><span>adult portions per meal</span></div><div class="stat"><b>${Math.round(adultF()*10)/10}</b><span>adult portions for night bites</span></div><div class="stat"><b>${piecesPerDay()}</b><span>snack pieces a day</span></div></div>
   <div class="bar" style="margin-top:12px">${bar}</div><div class="row note" style="margin-top:6px">${legend}</div>
   <div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>At one meal your family finishes about</th><th class="num">Amount</th></tr></thead><tbody>${ex.map(([i,n,q])=>`<tr><td>${esc(n)}</td><td class="num">${qty(i,q*F)}</td></tr>`).join("")}</tbody></table></div>
   <p class="note">Based on average UK portions: an adult portion is about 75 to 90 g dry rice and 150 to 180 g meat on the bone. A toddler eats about a third of an adult portion, a 4 to 6 year old about half. Appetite adjusts each person by 15 to 20%.</p></section>
  <section class="panel"><h3>Guests and leftovers</h3><p class="note">Guests: open a day on the Planner tab and add them; each counts as one adult portion that day. Leftover lunches and other options are on the More tab.</p></section>
  <section class="panel"><div class="statrow"><div class="stat"><b>${cooked}</b><span>dinners cooked</span></div><div class="stat"><b>${avg}</b><span>average rating</span></div><div class="stat"><b>${Object.keys(per).length}</b><span>dinners logged</span></div></div></section>
  <section class="panel"><h2>Family favourites</h2>${favs.length?`<ol class="steps">${favs.map(([id,s])=>`<li>${esc(RECIPES[id].n)} <span class="note">${s.toFixed(1)} ★</span></li>`).join("")}</ol>`:`<p class="note">Rate dinners on the Today tab and your top five appear here.</p>`}</section>
  ${kids.length?`<section class="panel"><h2>Learning to like it</h2><p class="note">Each time a child eats most of a dinner or has a taste, it moves one step. About 10 tastes usually wins a new food over.</p>
   ${learning.length?`<div class="tablewrap"><table><thead><tr><th>Dish</th>${kids.map(m=>`<th>${esc(m.name)}</th>`).join("")}</tr></thead><tbody>${learning.map(([id,p])=>`<tr><td>${esc(RECIPES[id].n)}</td>${kids.map(m=>{const n=p.kids[m.id]||0;return `<td><div class="progress"><i style="width:${Math.min(100,n*10)}%"></i></div><span class="note">${n} of 10</span></td>`}).join("")}</tr>`).join("")}</tbody></table></div>`:`<p class="note">Log what the children ate on the Today tab to start tracking.</p>`}</section>`:""}
</div>`;
}

const WRITE_ACTS=["planWorld","kit","cooked","star","kid","doswap","surprise","unswap","fz","guest","weekbake","planNight","delmember","addmember","fzPlan","frEat","frFreeze","delextra"];
function onClick(e){
  const b=e.target.closest("[data-act]");if(!b||b.tagName==="INPUT"||b.tagName==="SELECT")return;
  const a=b.dataset.act,k=b.dataset.k;
  if(a==="closesheet"){if(e.target!==b&&b.classList.contains("sheetbg"))return;closeSheet();return}
  if(!canWrite&&WRITE_ACTS.includes(a)){toast("You can view this plan but not change it.");return}
  if(a==="recipe"){const opts={};if(k){opts.date=parse(k);opts.slot=b.dataset.s;opts.p=portionsFor(opts.date,b.dataset.s)}if(b.dataset.mult)opts.mult=+b.dataset.mult;
    else if(RECIPES[b.dataset.id].batch){const bp=bakePlan(mondayOf(k?parse(k):todayD()))[b.dataset.id];if(bp)opts.mult=bp.mult}
    openRecipe(b.dataset.id,opts)}
  else if(a==="cook"){closeSheet();startCook(b.dataset.id,+b.dataset.scale||famF())}
  else if(a==="swapmore"){S.swapOff=(S.swapOff||0)+3;render()}
  else if(a==="swapall"){S.swapAll=!S.swapAll;render()}
  else if(a==="swapcuisine"){S.swapCuisine=b.dataset.c;render()}
  else if(a==="pref"){setPref(b.dataset.k,b.dataset.v);render()}
  else if(a==="planWorld"){setDay(k,{swap:{[b.dataset.s]:b.dataset.id}});closeSheet();toast(RECIPES[b.dataset.id].n+" planned for "+fmtShort(parse(k)))}
  else if(a==="moresub"){S.moreSub=b.dataset.v;render()}
  else if(a==="morego"){const g=b.dataset.go;if(isMoreKid(g))S.view=g;else{S.view="more";S.moreSub=g}render();window.scrollTo({top:0})}
  else if(a==="moreback"){S.view="more";S.moreSub=null;render();window.scrollTo({top:0})}
  else if(a==="goto"){S.view=b.dataset.v;if(b.dataset.sub)S.moreSub=b.dataset.sub;render();window.scrollTo({top:0})}
  else if(a==="mult"){S.pastryMult[b.dataset.id]=+b.dataset.m;renderSheet()}
  else if(a==="cooked"){const on=!(S.days[k]||{}).cooked;setDay(k,{cooked:on});if(on)toast("Logged. Leftovers are now in More, Fridge.")}
  else if(a==="star")setDay(k,{stars:+b.dataset.n});
  else if(a==="kid"){const cur=((S.days[k]||{}).kids||{})[b.dataset.kid];setDay(k,{kids:{[b.dataset.kid]:cur===b.dataset.o?"":b.dataset.o}})}
  else if(a==="openswap"){closeSheet();S.swap={k,s:b.dataset.s};S.swapOff=0;S.swapAll=false;S.swapSeed=null;render();setTimeout(()=>{const p=document.querySelector(".picker");if(p)p.closest(".panel").scrollIntoView({behavior:"smooth",block:"start"})},0)}
  else if(a==="closeswap"){S.swap=null;render()}
  else if(a==="doswap"){const s=b.dataset.s;S.swap=null;S.swapSeed=null;setDay(k,{swap:{[s]:b.dataset.id}});toast(b.dataset.id==="left"?"Leftovers it is":"Swapped to "+RECIPES[b.dataset.id].n)}
  else if(a==="unswap"){S.swap=null;const sw=Object.assign({},swapsFor(k));delete sw[b.dataset.s];const cur=Object.assign({},S.days[k]||{},{swap:sw});S.days[k]=cur;render();write("days/"+k,r=>r.set(cur))}
  else if(a==="surprise"){const cur=slotFor(parse(k),"D").id;const ids=Object.keys(RECIPES).filter(i=>RECIPES[i].cat==="dinner"&&i!==cur&&RECIPES[i].mins<=30);const pick=ids[Math.floor(Math.random()*ids.length)];setDay(k,{swap:{D:pick}});toast("Tonight: "+RECIPES[pick].n)}
  else if(a==="toggleday"){S.open=S.open===k?null:k;S.swap=null;render()}
  else if(a==="wk"){S.weekOffset=b.dataset.d==="0"?0:Math.max(0,S.weekOffset+(+b.dataset.d));S.open=null;S.swap=null;render()}
  else if(a==="shopwk"){S.shopOffset=Math.max((((todayD().getDay()+6)%7)>=5&&S.shopNext!==false)?-1:0,(S.shopOffset||0)+(+b.dataset.d));render()}
  else if(a==="goshop"){S.view="shop";S.shopOffset=0;render();window.scrollTo({top:0})}
  else if(a==="guest"){const g=Math.max(0,Math.min(20,guestsOn(k)+(+b.dataset.d)));setDay(k,{guests:g})}
  else if(a==="weekbake"){const t=todayD();const mon=ymd(addDays(mondayOf(t),((t.getDay()+6)%7)===6?7:0));setWeek(mon,{bake:b.dataset.id});closeSheet();toast(RECIPES[b.dataset.id].n+" is this weekend's treat. Added to shopping.")}
  else if(a==="planNight"){const t=todayD();let fri=addDays(mondayOf(t),4);if(t>fri)fri=addDays(fri,7);setDay(ymd(fri),{swap:{N:b.dataset.id}});closeSheet();toast(RECIPES[b.dataset.id].n+" planned for "+fmtShort(fri))}
  else if(a==="fz"){const f=S.freezer[b.dataset.id];if(!f)return;const p=Math.max(0,(f.portions||0)+(+b.dataset.d));if(p===0){setColl("freezer",b.dataset.id,null);toast("Bag used up")}else setColl("freezer",b.dataset.id,Object.assign({},f,{portions:p}))}
  else if(a==="fzPlan"){const f={name:b.dataset.name,portions:+b.dataset.p,months:+b.dataset.m,frozen:ymd(todayD())};setColl("freezer",newId("f"),f);setWeek(b.dataset.w,{fz:{[b.dataset.key]:true}});toast("Logged in the freezer")}
  else if(a==="frEat"){setColl("fridge",b.dataset.id,null);toast("Removed")}
  else if(a==="frFreeze"){const f=S.fridge[b.dataset.id];setColl("fridge",b.dataset.id,null);setColl("freezer",newId("f"),{name:f.name,portions:1,months:f.type==="meat"||f.type==="mince"||f.type==="fish"?3:2,frozen:ymd(todayD())});toast("Moved to the freezer")}
  else if(a==="delextra"){e.preventDefault();const w=S.weeks[b.dataset.w]||{};const ex=Object.assign({},w.extra||{});delete ex[b.dataset.id];const cur=Object.assign({},w,{extra:ex});S.weeks[b.dataset.w]=cur;render();write("weeks/"+b.dataset.w,r=>r.set(cur))}
  else if(a==="addmember"){const ms=members().slice();ms.push({id:newId("m"),name:"New person",group:"woman",app:"normal"});setSettings({members:ms})}
  else if(a==="delmember"){const ms=members().slice();ms.splice(+b.dataset.i,1);setSettings({members:ms})}
}

function pickStepper(id){const n=picked(id);return n?`<span class="stepper"><button data-act="pick" data-id="${id}" data-d="-1" ${W()} aria-label="Less">−</button><b>${n}</b><button data-act="pick" data-id="${id}" data-d="1" ${W()} aria-label="More">+</button></span>`:`<button class="btn small" data-act="pick" data-id="${id}" data-d="1" ${W()}>+ Add to shop</button>`}

function planBalanced(mk){
  const mon=parse(mk);const t=todayD();const wn=S.settings.world==null?1:+S.settings.world;
  const pool=Object.keys(RECIPES).filter(id=>{const r=RECIPES[id];if(r.cat!=="dinner")return false;if(S.settings.noPeanut&&r.ing.some(x=>["peanutbutter","suyaspice"].includes(x[0])))return false;return true});
  const recent=new Set();for(let b=1;b<=10;b++){const s=slotFor(addDays(mon,-b),"D");if(s)recent.add(s.id)}
  const fixed=[];for(let i=0;i<7;i++){const d=addDays(mon,i);const k=ymd(d);fixed[i]=(d<t||(S.days[k]||{}).cooked)?slotFor(d,"D").id:null}
  const rnd=hashStr("plan"+mk+Date.now());let best=null,bestSc=-1e9;
  for(let tries=0;tries<400;tries++){
    const pick=[];const used=new Set(fixed.filter(Boolean));
    for(let i=0;i<7;i++){if(fixed[i]){pick[i]=fixed[i];continue}
      const weekday=i<5;const wantWorld=(wn>=1&&i===3)||(wn>=2&&i===1);
      const c=pool.filter(id=>!used.has(id)&&(!weekday||RECIPES[id].mins<=75)&&((RECIPES[id].cuisine!=="naija")===wantWorld||(!wantWorld&&wn===0)));
      const list=c.length?c:pool.filter(id=>!used.has(id));
      const id=list[Math.floor(rnd()*list.length)];pick[i]=id;used.add(id)}
    const b=weekBalance(mon,pick);let sc=b.score*10;
    for(const id of pick){const rt=ratingOf(id);sc+=rt?(rt-3)*1.5:0.5;const kl=kidsLike(id);if(kl!=null)sc+=(kl-0.5)*3;if(recent.has(id))sc-=4;const tg=tagsOf(id);if(tg.fried)sc-=1}
    const cuis=new Set(pick.map(id=>RECIPES[id].r||RECIPES[id].cuisine));sc+=cuis.size*0.6;
    if(budget()){const est=pick.reduce((s,id)=>s+recipeCost(RECIPES[id],famF()),0);sc-=Math.max(0,est-budget()*0.55)*0.4}
    if(sc>bestSc){bestSc=sc;best=pick}
  }
  let n=0;for(let i=0;i<7;i++){if(fixed[i])continue;const d=addDays(mon,i);const k=ymd(d);const cur=slotFor(d,"D").id;if(best[i]!==cur){setDay(k,{swap:{D:best[i]}});n++}}
  const b=weekBalance(mon);toast(n?`Planned ${n} dinner${n>1?"s":""}. Balance ${b.score} of ${b.of}. Shopping and Money updated.`:"This week was already the best mix");
}

  const out=[];
  if(p.kind==="week"){for(let i=0;i<7;i++){const d=addDays(p.a,i);out.push({l:DAYN[i][0]+DAYN[i][1],a:d,b:addDays(d,1)})}}
  else if(p.kind==="month"){let d=p.a;while(d<p.b){const e=addDays(d,7)<p.b?addDays(d,7):p.b;out.push({l:d.getDate()+"–"+(addDays(e,-1).getDate()),a:d,b:e});d=e}}
  else{let d=new Date(p.a);while(d<p.b){const e=new Date(d.getFullYear(),d.getMonth()+1,1);out.push({l:MON[d.getMonth()]+(p.kind==="all"&&d.getMonth()===0?" "+String(d.getFullYear()).slice(2):""),a:d,b:e});d=e}}
  for(const k of out){k.v=es.filter(e=>inRange(e,k.a,k.b)).reduce((s,e)=>s+e.amt,0);k.bud=budget()?budget()*Math.round((k.b-k.a)/864e5)/7:0}
  return out}

/* ---------- smart insights ---------- */
function unitPrices(){const map={};for(const e of entriesAll())for(const it of (e.items||[])){if(!it.id||!(it.p>0))continue;const u=it.p/Math.max(1,it.q||1);(map[it.id]=map[it.id]||[]).push({u,shop:e.shop,date:e.date})}return map}
function insights(p,es,total,prev){
  const out=[];const all=entriesAll();
  if(!all.length)return [["","Start by logging a shop. Type the receipt total, or add items one by one. Everything below fills in as you go."]];
  if(prev!=null&&prev>0){const ch=(total-prev)/prev*100;if(p.current){const paceTotal=total/p.elapsed*p.days;const pc=(paceTotal-prev)/prev*100;out.push([pc>10?"red":pc<-10?"green":"",`At this pace you'll spend about <b>${money0(paceTotal)}</b> this ${p.kind}, ${Math.abs(Math.round(pc))}% ${pc>=0?"more":"less"} than last ${p.kind} (${money0(prev)}).`])}
    else out.push([ch>10?"red":ch<-10?"green":"",`<b>${money0(total)}</b>, ${Math.abs(Math.round(ch))}% ${ch>=0?"more":"less"} than the ${p.kind} before (${money0(prev)}).`])}
  if(budget()&&p.kind!=="all"){const bud=budget()*p.days/7;const proj=p.current?total/p.elapsed*p.days:total;out.push([proj>bud?"red":"green",proj>bud?`Heading <b>${money0(proj-bud)} over</b> the ${money0(bud)} budget for this ${p.kind}.`:`Within budget: ${money0(bud-proj)} to spare out of ${money0(bud)}${p.current?" if you keep this pace":""}.`])}
  const wks=[];for(let i=1;i<=8;i++){const a=addDays(mondayOf(todayD()),-7*i);wks.push(spentRange(a,addDays(a,7)))}const used=wks.filter(x=>x>0);
  if(used.length>=2){const avg=used.reduce((a,b)=>a+b,0)/used.length;out.push(["",`Your usual week is about <b>${money0(avg)}</b>. That's about ${money0(avg*52/12)} a month and ${money0(avg*52)} a year.`])}
  const dow=[0,0,0,0,0,0,0];for(const e of all)dow[(parse(e.date).getDay()+6)%7]+=e.amt;const mx=dow.indexOf(Math.max(...dow));if(all.length>=4&&dow[mx]>0)out.push(["",`You spend most on <b>${DAYL[mx]}s</b> (${Math.round(dow[mx]/dow.reduce((a,b)=>a+b,0)*100)}% of everything).`]);
  const catSum=k=>es.reduce((s,e)=>s+catParts(e).filter(([c])=>c===k).reduce((t,[,v])=>t+v,0),0);const eo=catSum("eatout");if(total&&eo/total>0.2)out.push(["red",`Eating out and takeaways are ${Math.round(eo/total*100)}% of this ${p.kind} (${money0(eo)}). A Friday night bite from the Night Bites tab costs far less.`]);
  const sn=catSum("snacks");if(total&&sn/total>0.15)out.push(["",`Snacks and treats are ${Math.round(sn/total*100)}% of spending. Fruit of the day and homemade bakes help here.`]);
  const up=unitPrices();let cheap=0;
  for(const [id,arr] of Object.entries(up)){if(!ING[id])continue;const byShop={};for(const x of arr)(byShop[x.shop]=byShop[x.shop]||[]).push(x.u);const sh=Object.entries(byShop).map(([s,v])=>[s,v.reduce((a,b)=>a+b,0)/v.length]).sort((a,b)=>a[1]-b[1]);
    if(sh.length>=2&&sh[sh.length-1][1]>sh[0][1]*1.1&&cheap<3){cheap++;out.push(["green",`<b>${esc(ING[id].n)}</b> is cheapest at ${esc(sh[0][0])} (${money(sh[0][1])}) vs ${esc(sh[sh.length-1][0])} (${money(sh[sh.length-1][1])}).`])}
    const s=arr.slice().sort((a,b)=>b.date.localeCompare(a.date));if(s.length>=2){const ch=(s[0].u-s[1].u)/s[1].u*100;if(Math.abs(ch)>=10)out.push([ch>0?"red":"green",`${esc(ING[id].n)} ${ch>0?"went up":"came down"} ${Math.abs(Math.round(ch))}% since you last bought it (${money(s[1].u)} to ${money(s[0].u)}).`])}}
  if(p.kind==="week"){const plan=weekCost(p.a).fresh;if(total&&plan)out.push(["",`The meal plan for this week was estimated at ${money0(plan)}; you've logged ${money0(total)} with dates in this week.`])}
  const ppd=total/p.elapsed/Math.max(1,members().length);if(total)out.push(["",`That's about <b>${money(ppd)}</b> per person per day for ${members().length} people.`]);
  return out}

  const nDates=Object.keys(byDate).length;
  const bud=budget();const pbud=bud&&kind!=="all"?bud*p.days/7:0;
  return `<div class="stack">
  ${H||S.spForm?"":receiptPanel()}
  <section class="panel">
   ${H?`<div class="seg big" role="tablist">${[["week","Week"],["month","Month"],["year","Year"],["all","All time"]].map(([k,n])=>`<button class="${kind===k?"sel":""}" data-act="costk" data-k="${k}">${n}</button>`).join("")}</div>`:`<h2>Spending this week</h2>`}
   <div class="weekhead" style="margin-top:10px"><div><div class="note">${esc(p.label)}</div><div class="bigsum">${money(total)}</div>
    <div class="note">${prev!=null?(prev?`${total>=prev?"▲":"▼"} ${money0(Math.abs(total-prev))} vs last ${kind}`:`Nothing logged last ${kind}`):""}${p.current&&kind!=="all"?` · ${p.days-p.elapsed} day${p.days-p.elapsed===1?"":"s"} to go`:""}</div></div>
   ${H&&kind!=="all"?`<div class="row"><button class="btn small" data-act="costoff" data-d="-1" aria-label="Previous">‹</button><button class="btn small" data-act="costoff" data-d="0">Now</button><button class="btn small" data-act="costoff" data-d="1" aria-label="Next">›</button></div>`:""}</div>
   ${pbud?`<div class="progress" style="margin-top:8px"><i style="width:${Math.min(100,Math.round(total/pbud*100))}%;${total>pbud?"background:var(--jollof)":""}"></i></div><div class="note">${money0(total)} of ${money0(pbud)} budget for this ${kind}</div>`:""}
   <div class="hbars">${bars}</div>${bud?`<div class="note"><span class="key budk"></span> budget</div>`:""}
   ${H?"":`<div class="row" style="margin-top:6px"><button class="btn primary" data-act="spopen" ${W()}>＋ Log a purchase</button>${(()=>{const mk=ymd(shopMon());const tk=Object.entries(((S.weeks[mk]||{}).shop)||{}).filter(([,v])=>v).length;return tk?`<button class="btn" data-act="spticked" data-w="${mk}" ${W()}>Log ${tk} ticked shopping item${tk>1?"s":""}</button>`:""})()}<button class="btn" data-act="gohist" data-v="spend">Past weeks, months and years</button></div>`}
  </section>
  ${S.spForm&&!H?spendForm():""}

   ${all.length?`<div class="row" style="margin-top:10px"><button class="btn small" data-act="spcsv">Copy as a spreadsheet (CSV)</button></div>`:""}</section>

  <details class="panel"><summary><b>What the meal plan should cost</b></summary>${planCostPanel()}</details>
  <details class="panel" ${S.priceQ?"open":""}><summary><b>Price book</b></summary><p class="note">Typical UK shelf prices (Aldi, Lidl, Tesco, Asda and African grocers, 2025 to 2026), not live prices. When you log items with prices, the book learns what you actually pay.</p>
   <label class="f">Find an item<input type="text" id="priceQ" value="${esc(S.priceQ||"")}" placeholder="e.g. chicken, plantain, rice"></label>${priceBookRows()}</details>`}</div>`;
}
function planCostPanel(){const mon=shopMon();const wc=weekCost(mon);
  const dinners=[0,1,2,3,4,5,6].map(i=>{const d=addDays(mon,i);const s=slotFor(d,"D");const r=RECIPES[s.id];const c=recipeCost(r,portionsFor(d,"D"));return {i,d,id:s.id,r,c}});
  const dmax=dinners.reduce((a,b)=>b.c>a.c?b:a,dinners[0]);
  return `<p class="note">Week of ${esc(fmtShort(mon))}: weekly shop about <b>${money0(wc.fresh)}</b>, plus ${money0(wc.cup)} of cupboard items if you've run out.</p>
  ${budget()&&wc.fresh>budget()?`<div class="alert">About ${money0(wc.fresh-budget())} over budget. ${esc(dmax.r.n)} on ${DAYL[dmax.i]} is the priciest dinner. <button class="linkbtn" data-act="moneyswap" data-k="${ymd(dmax.d)}">Swap it for something cheaper</button></div>`:""}
  ${dinners.map(x=>`<div class="kidrow"><span>${DAYN[x.i]} · <button class="linkbtn" data-act="recipe" data-id="${x.id}" data-k="${ymd(x.d)}" data-s="D">${esc(x.r.n)}</button></span><span class="note">${money(x.c)}</span></div>`).join("")}
  <div class="row" style="margin-top:8px"><button class="btn small" data-act="goto" data-v="shop">Open the shopping list</button></div>`}
function priceBookRows(){const q=(S.priceQ||"").toLowerCase();if(q.length<2)return "";
  return Object.keys(PRICE).filter(id=>ING[id]&&ING[id].n.toLowerCase().includes(q)).slice(0,12).map(id=>{const pr=priceOf(id);return `<div class="kidrow"><span>${esc(ING[id].n)}<div class="note">${esc(pr.lab||"")}${pr.mine?" · your price":""}</div></span><span class="row" style="gap:6px"><input class="pricein" type="number" step="0.01" min="0" inputmode="decimal" value="${pr.p.toFixed(2)}" data-price="${id}" aria-label="Price for ${esc(ING[id].n)}" ${W()}>${pr.mine?`<button class="btn small" data-act="pricereset" data-id="${id}" ${W()}>Reset</button>`:""}</span></div>`}).join("")||`<p class="note">No match.</p>`}

  const opts=Object.keys(PRICE).filter(id=>ING[id]).map(id=>`<option value="${esc(ING[id].n)}"></option>`).join("");

   ${f.mode==="total"?`<label class="f">Amount paid (£)<input type="number" id="spAmt" step="0.01" min="0" inputmode="decimal" value="${f.amt!=null?f.amt:""}" placeholder="0.00"></label>`:`

function readForm(){const f=S.spForm;if(!f)return;const g=id=>document.getElementById(id);
  if(g("spCat"))f.cat=g("spCat").value;if(g("spDate"))f.date=g("spDate").value||ymd(todayD());if(g("spAmt"))f.amt=g("spAmt").value;if(g("spNote"))f.note=g("spNote").value;if(g("spLearn"))f.learn=g("spLearn").checked;
  if(g("spTotal")){const v=parseFloat(g("spTotal").value);if(v>=0)f.total=Math.round(v*100)/100}
  if(g("spTick")&&f.scan)f.scan.tick=g("spTick").checked;
  document.querySelectorAll("[data-spc]").forEach(s=>{const it=f.items[+s.dataset.spc];if(it)it.c=s.value});
  document.querySelectorAll("[data-spi]").forEach(i=>{const it=f.items[+i.dataset.spi];if(it){const v=parseFloat(i.value);if(v>=0&&Math.abs(v-it.p)>0.004){it.p=v;it.est=false}}})}
function findIng(name){const n=name.trim().toLowerCase();if(!n)return null;return Object.keys(PRICE).find(id=>ING[id]&&ING[id].n.toLowerCase()===n)||Object.keys(PRICE).find(id=>ING[id]&&ING[id].n.toLowerCase().startsWith(n))||null}
function saveSpend(){readForm();const f=S.spForm;let amt,items=null;
  if(f.mode==="items"){if(!f.items.length){toast("Add at least one item");return}items=f.items.map(it=>{const x={id:it.id||"",n:it.n||"",q:+it.q||1,p:Math.round((+it.p||0)*100)/100};if(it.c)x.c=it.c;return x});amt=items.reduce((s,it)=>s+it.p,0);if(f.scan&&+f.total>0)amt=+f.total}
  else{amt=parseFloat(f.amt);if(!(amt>0)){toast("Type the amount you paid");return}}
  const d=parse(f.date);const wk=f.wk||ymd(((d.getDay()+6)%7)>=5?addDays(mondayOf(d),7):mondayOf(d));
  const doc={date:f.date,shop:f.shop,cat:f.cat,amt:Math.round(amt*100)/100,note:(f.note||"").trim(),wk,t:Date.now()};if(items)doc.items=items;if(f.scan)doc.rcpt=f.scan.by||true;
  setColl("spend",newId("sp"),doc);
  if(items&&f.learn!==false){const p=Object.assign({},S.settings.prices||{});let n=0;for(const it of f.items){if(it.id&&PRICE[it.id]&&it.p>0&&!it.est){p[it.id]={p:Math.round(it.p/it.q*100)/100};n++}}if(n)setSettings({prices:p})}

/* ===================== Folding sections in More =====================
   Every section on the More pages (Settings, Fridge, Freezer, Family)
   and every aisle of the shopping list shows only its title until
   it is tapped. What is open is remembered while the app is open, so ticking
   an item or changing a setting doesn't close the section you are in. */
var FOLD={open:{}};
try{FOLD.open=JSON.parse(sessionStorage.getItem("nft-fold")||"{}")||{}}catch(e){}
function foldSave(){try{sessionStorage.setItem("nft-fold",JSON.stringify(FOLD.open))}catch(e){}}
function foldMake(box,key,head,body,count){
  box.classList.add("fold");box.dataset.fold=key;
  const open=!!FOLD.open[key];if(open)box.classList.add("open");
  const id="fold-"+Math.random().toString(36).slice(2,9);
  const hd=document.createElement("button");hd.type="button";hd.className="foldhd";hd.setAttribute("aria-expanded",String(open));hd.setAttribute("aria-controls",id);
  hd.appendChild(head);
  if(count){const c=document.createElement("span");c.className="foldct";c.textContent=count;hd.appendChild(c)}
  body.className="foldbd";body.id=id;
  box.insertBefore(hd,box.firstChild);box.appendChild(body);
}
function foldMore(){
  if(S.view!=="more"&&S.view!=="shop")return;
  const view=$("#view");if(!view)return;
  const sub=S.view==="shop"?"shop":(S.moreSub||"menu");
  // Panels: a section whose first element is its heading folds behind that heading.
  view.querySelectorAll(".stack > section.panel").forEach(p=>{
    const h=p.firstElementChild;if(!h||h.tagName!=="H2")return;
    const body=document.createElement("div");
    while(h.nextSibling)body.appendChild(h.nextSibling);
    p.removeChild(h);
    foldMake(p,sub+"|"+h.textContent.trim(),h,body);
  });
  // Shopping: each aisle (and Your extras) folds behind its aisle name, with a count.
  if(sub==="shop"){
    const panel=view.querySelector(".stack > section.panel");if(!panel)return;
    [...panel.querySelectorAll(":scope > .cat")].forEach(cat=>{
      const grp=document.createElement("div");grp.className="foldgrp";
      panel.insertBefore(grp,cat);panel.removeChild(cat);
      const body=document.createElement("div");
      while(grp.nextSibling&&!(grp.nextSibling.classList&&grp.nextSibling.classList.contains("cat")))body.appendChild(grp.nextSibling);
      const items=body.querySelectorAll(".shopitem"),ticked=body.querySelectorAll(".shopitem.done");
      const name=(cat.firstChild&&cat.firstChild.nodeType===3?cat.firstChild.textContent:cat.textContent).trim();
      foldMake(grp,"shop|"+name,cat,body,items.length?ticked.length+" of "+items.length:"");
      if(items.length&&ticked.length===items.length)grp.classList.add("alldone");
    });
  }
}
document.addEventListener("click",e=>{
  const hd=e.target.closest(".foldhd");if(!hd)return;
  const box=hd.parentElement,key=box.dataset.fold;
  const open=!box.classList.contains("open");
  box.classList.toggle("open",open);hd.setAttribute("aria-expanded",String(open));
  if(open)FOLD.open[key]=1;else delete FOLD.open[key];
  foldSave();
});

const shortName=id=>{let n=ING[id].n.replace(/\s*\([^)]*\)/g,"").replace(/,.*$/,"");return n.charAt(0).toLowerCase()+n.slice(1)};
function fmtMin(m){if(m<1)return Math.round(m*60)+" sec";if(m>=60){const h=Math.floor(m/60),mm=Math.round(m%60);return h+" hr"+(mm?" "+mm+" min":"")}return Math.round(m)+" min"}
function methodOf(r){
  const src=r.full||r.steps||[];
  return src.map(t=>{let min=0;const m=t.match(/\|([\d.]+)\s*$/);
    if(m){min=+m[1];t=t.slice(0,m.index)}
    else{const h=t.match(/(\d+)(?: to (\d+))? hours?\b/);const mm=t.match(/(\d+)(?: to (\d+))? min/);if(mm)min=+mm[1];else if(h)min=+h[1]*60}
    return {t,min}});
}
function fillStep(t,r,scale){
  const q={};for(const [i,v] of r.ing)q[i]=v;
  let h=esc(t);
  h=h.replace(/\{w:(\d+)\}/g,(_,ml)=>`<b class="amt">${qty("milk",+ml*scale).replace(" litres"," litres")}</b>`);
  h=h.replace(/\{([a-z_0-9]+)(?:\*([\d.]+))?\}/g,(_,id,f)=>{if(!ING[id]||q[id]==null)return id;const amt=q[id]*scale*(f?+f:1);return `<b class="amt">${qty(id,amt)}</b> ${esc(shortName(id))}`});
  return h;
}

const TIMERS=[];let tickH=null,alarmH=null,audioCtx=null,wakeLock=null;
function famCounts(){const ms=members();const ad=ms.filter(m=>!(GROUPS[m.group]||{}).kid);const kd=ms.filter(m=>(GROUPS[m.group]||{}).kid);
  return {ad:ad.length,kd:kd.length,af:ad.length?ad.reduce((s,m)=>s+fac(m),0)/ad.length:1,kf:kd.length?kd.reduce((s,m)=>s+fac(m),0)/kd.length:0.4}}
function cookScale(c){const r=RECIPES[c.id];if(r.batch)return c.scale;const f=famCounts();return Math.max(0.3,c.ad*f.af+c.kd*f.kf+(c.extraOn?c.extra:0))}
function startCook(id,scale){const r=RECIPES[id];const f=famCounts();

    if(diff>0.05){const g=Math.round(diff/f.af);const lf=S.settings.lunchFor||"adults";
      // part of the difference may be guests; the rest is tomorrow's lunch
      const lunch=r.cat==="dinner"?(lf==="all"?famF():lf==="adults"?adultF():0):0;const guests=Math.max(0,Math.round((diff-lunch)/1));ad+=guests;extra=Math.max(0,diff-guests)}}
  S.cook={id,scale:r.batch?(scale||1):scale,ad,kd,extra,extraOn:extra>0,i:0,start:Date.now(),got:{}};
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  if(PREFS.awake&&navigator.wakeLock)navigator.wakeLock.request("screen").then(w=>wakeLock=w).catch(()=>{});
  document.body.style.overflow="hidden";renderCook();ensureTick();try{renderAsk()}catch(e){}}
function endCook(){S.cook=null;TIMERS.length=0;stopAlarm();if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null}document.body.style.overflow="";$("#cook").innerHTML="";try{renderAsk()}catch(e){}}

      :`<div class="bigtimer"><span class="tt">${fmtClock(st.min*60)}</span><div class="row" style="justify-content:center"><button class="btn primary big" data-ck="start" data-min="${st.min}">Start ${fmtMin(st.min)} timer</button></div><p class="note" style="text-align:center;margin:6px 0 0">When it rings, move to the next step.</p></div>`)

  }

function tLeft(t){if(t.paused)return t.left;return Math.max(0,(t.endAt-Date.now())/1000)}
function fmtClock(sec){sec=Math.max(0,Math.ceil(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+":"+pad(m):m)+":"+pad(s)}
function ensureTick(){if(tickH)return;tickH=setInterval(()=>{

  const sw=document.getElementById("sw");if(sw)sw.textContent=fmtClock((Date.now()-S.cook.start)/1000);

    document.querySelectorAll(`[data-tid="${t.id}"]`).forEach(e=>{const tt=e.classList.contains("bigtimer")?e.querySelector(".tt"):e;if(tt)tt.textContent=fmtClock(tLeft(t))})}

function beep(){if(!PREFS.sound||!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="square";o.frequency.value=880;g.gain.setValueAtTime(0.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.25,audioCtx.currentTime+0.02);g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.5);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.55)}catch(e){}}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-ck]");if(!b||!S.cook)return;const c=S.cook,a=b.dataset.ck,n=cookSteps().length;
