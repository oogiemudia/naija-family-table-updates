   {name:"add_to_shopping",description:"Add a free-text item to the extras on the current shopping list (for example nappies, or an extra ingredient).",inputSchema:{type:"object",properties:{item:{type:"string"}},required:["item"]},
    execute:({item})=>{item=String(item).slice(0,80).trim();if(!item)throw new Error("Empty item");if(!canWrite)throw new Error("This viewer can't change the plan");const mk=ymd(shopMon());setWeek(mk,{extra:{[newId("x")]:{name:item,done:false}}});ASK.say("Added "+item+"…");return {ok:true,list_week:mk,item}}},
   {name:"set_fruit",description:"Set the fruit of the day for a date. fruit_id from the fruit ids list.",inputSchema:{type:"object",properties:{date:{type:"string"},fruit_id:{type:"string"}},required:["date","fruit_id"]},
    execute:({date,fruit_id})=>{date=String(date);fruit_id=String(fruit_id);if(!ITEMS[fruit_id])throw new Error("No fruit "+fruit_id);if(!canWrite)throw new Error("This viewer can't change the plan");setDay(date,{fruit:fruit_id});return {ok:true,date,fruit:ITEMS[fruit_id].n}}},
   {name:"log_purchase",description:"Record money the parent says they spent. category one of: "+SCATS.map(c=>c[0]).join(", ")+".",inputSchema:{type:"object",properties:{shop:{type:"string"},amount:{type:"number"},date:{type:"string"},category:{type:"string"},note:{type:"string"}},required:["shop","amount"]},
    execute:({shop,amount,date,category,note})=>{const amt=Math.round(Number(amount)*100)/100;if(!(amt>0))throw new Error("Bad amount");if(!canWrite)throw new Error("This viewer can't change the plan");const d=/^\d{4}-\d\d-\d\d$/.test(String(date||""))?String(date):ymd(todayD());const sh=String(shop||"Other").slice(0,40);const c=SCAT[String(category)]?String(category):guessCat(sh);
      setColl("spend",newId("sp"),{date:d,shop:sh,cat:c,amt,note:String(note||"").slice(0,80),wk:ymd(mondayOf(parse(d))),t:Date.now()});ASK.say("Logged "+money(amt)+"…");return {ok:true,shop:sh,amount:amt,date:d}}},
   {name:"get_shopping_list",description:"The current week's shopping list with quantities and estimated prices, grouped by aisle.",execute:()=>{const mon=shopMon();const it=shopList(mon);const out={};for(const [id,x] of Object.entries(it)){const a=ING[id].aisle;(out[a]=out[a]||[]).push(ING[id].n+": "+qty(id,x.q)+" ~£"+lineCost(id,x.q).toFixed(2))}return {week:ymd(mon),aisles:out}}},
   {name:"get_spending",description:"Spending logged for a period: week, month, year or all. Returns total, by category and by shop, and the last purchases.",inputSchema:{type:"object",properties:{period:{type:"string"}}},
    execute:({period})=>{const k=["week","month","year","all"].includes(String(period))?String(period):"month";const p=periodOf(k,0);const es=entriesAll().filter(e=>inRange(e,p.a,p.b));const by=(f)=>{const o={};for(const e of es)o[f(e)]=(o[f(e)]||0)+e.amt;return o};
      return {period:p.label,total:es.reduce((s,e)=>s+e.amt,0),by_category:(()=>{const o={};for(const e of es)for(const [c,v] of catParts(e)){const k=SCAT[c]||c;o[k]=Math.round(((o[k]||0)+v)*100)/100}return o})(),by_shop:by(e=>e.shop),recent:es.slice(0,12).map(e=>e.date+" "+e.shop+" £"+e.amt.toFixed(2))}}},
   {name:"open_recipe",description:"Show a recipe on the parent's screen.",inputSchema:{type:"object",properties:{id:{type:"string"}},required:["id"]},execute:({id})=>{id=String(id);if(!RECIPES[id])throw new Error("No recipe "+id);ASK.pendingOpen=id;return {ok:true}}}
  ]}
function askMd(s){let h=esc(s);h=h.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^#{1,4} (.+)$/gm,"<b>$1</b>").replace(/^\s*[-*•] (.+)$/gm,"<li>$1</li>").replace(/^\s*\d+[.)] (.+)$/gm,"<li>$1</li>");h=h.replace(/(<li>.*<\/li>\n?)+/g,m=>"<ul>"+m.replace(/\n/g,"")+"</ul>");return h.replace(/\n{2,}/g,"<br><br>").replace(/\n/g,"<br>")}
function askSuggestions(){const v=S.view,sub=S.moreSub;
  if(v==="money"||(v==="more"&&sub==="history"))return ["How is my spending this month?","Where can I save money this week?","I spent £45 at Aldi today"];
  if(v==="week")return ["Make next week healthier","Swap Thursday's dinner for something quicker","Which dinners can I batch cook on Sunday?"];
  if(v==="shop"||(v==="more"&&sub==="shop"))return ["What's the most expensive thing on my list?","Add nappies to the shopping","What can I buy at the African grocer?"];
  if(v==="fruit"||v==="snack")return ["Which fruits are best for toddlers right now?","Healthy nut-free snacks for nursery","Is dried mango OK for a 2-year-old?"];
  if(S.sheet&&S.sheet.id)return ["How do I make this without a blender?","Can I freeze this?","Make it toddler friendly"];
  return ["What can I cook in 30 minutes tonight?","My child won't eat vegetables, any ideas?","What's for dinner this week?"]}
function renderAsk(){
  try{tabSync()}catch(e){}
  const fab=$("#askFab"),pan=$("#askPanel");if(!fab||!pan)return;
  fab.hidden=askHidden()||ASK.open||!!S.cook;
  pan.hidden=!ASK.open;if(!ASK.open){pan.innerHTML="";return}
  const msgs=ASK.turns.map(t=>`<div class="amsg ${t.role}">${t.role==="user"?esc(t.content):askMd(t.content)}</div>`).join("");
  pan.innerHTML=`<div class="askhead"><b>Ask Claude</b><span class="row" style="gap:6px">${ASK.turns.length&&!ASK.busy?`<button class="btn small" data-act="asknew">New chat</button>`:""}<button class="btn small" data-act="askhide" title="Hide the floating button (turn it back on in More, Settings)">Hide button</button><button class="btn small" data-act="askclose" aria-label="Close">×</button></span></div>
   <div class="askbody" id="askBody">${!ASK.fn?`<div class="alert">${ASK.ready?`<b>Claude isn't available on this screen yet.</b> Ask works when the app is opened at claude.ai or in the Claude app while signed in to a Claude account, and the account allows Claude in artifacts. If you opened it signed out, in a private window, or from an account in another organisation, sign in with your own account and reload.${ASK.err?" ("+esc(ASK.err)+")":""}`:"Connecting to Claude…"}</div>`:""}${msgs||!ASK.fn?msgs:`<p class="note">Ask anything about meals, cooking, the children's food, shopping or spending. Claude can see this week's plan and can swap meals, add to shopping and log spending for you.</p>`}
   ${ASK.busy?`<div class="amsg assistant live" id="askLive">${ASK.live?askMd(ASK.live):`<span class="note">${esc(ASK.status||"Thinking…")}</span>`}</div>`:""}
   ${ASK.fn&&!ASK.busy&&!ASK.turns.length?`<div class="chips">${askSuggestions().map(s=>`<button class="chipb" data-act="asksug">${esc(s)}</button>`).join("")}</div>`:""}</div>
   <form class="askform" id="askForm"><textarea id="askIn" rows="1" placeholder="Ask about meals, shopping, money…" ${ASK.busy||!ASK.fn?"disabled":""}>${esc(ASK.draft||"")}</textarea>${ASK.busy?`<button type="button" class="btn small" data-act="askstop">Stop</button>`:`<button type="submit" class="btn primary small">Send</button>`}</form>`;
  const bd=$("#askBody");if(bd)bd.scrollTop=bd.scrollHeight;
}
ASK.say=s=>{ASK.status=s;const l=$("#askLive");if(l&&!ASK.live)l.innerHTML=`<span class="note">${esc(s)}</span>`};
const ASK_ERR={not_granted:"Claude wasn't allowed for this app. You can allow it from the app's permissions.",rate_limited:"Too many questions at once. Wait a minute and try again.",prompt_too_large:"That was too much to read in one go. Try a shorter question or start a new chat.",session_expired:"Your Claude sign-in has expired. Reload the page.",sampling_disabled:"Asking Claude is turned off for this account.",capability_disabled:"Asking Claude is turned off for this account.",refused:"Claude couldn't help with that one."};
async function askSend(q){q=String(q||"").trim();if(!q||ASK.busy||!ASK.fn)return;
  ASK.turns.push({role:"user",content:q});ASK.draft="";ASK.busy=true;ASK.live="";ASK.status="Thinking…";renderAsk();
  const ctl=ASK.ctl=new AbortController();
  const hist=ASK.turns.slice(-10);while(hist.length&&hist[0].role!=="user")hist.shift();
  const input=[{role:"user",content:ASK_RULES+"\n\nAPP DATA\n"+askContext()+"\n\nThe parent's messages follow."},{role:"assistant",content:"Understood. I'll use the app data and tools."}].concat(hist);
  try{const opts={signal:ctl.signal,cache:false,onText:({text})=>{ASK.live=text;const l=$("#askLive");if(l)l.innerHTML=askMd(text);const bd=$("#askBody");if(bd)bd.scrollTop=bd.scrollHeight}};
    if(ASK.tools){delete opts.cache;opts.tools=askTools()}
    const {text,truncated}=await ASK.fn(input,opts);
    ASK.turns.push({role:"assistant",content:text+(truncated?"\n\n(Cut short. Ask for less at a time.)":"")});
  }catch(e){const keep=e&&e.text?e.text+"\n\n":"";ASK.turns.push({role:"assistant",content:e&&e.code==="cancelled"?(keep+"(Stopped.)"):keep+(ASK_ERR[e&&e.code]||"Something went wrong reaching Claude. Try again in a moment.")})}
  finally{ASK.busy=false;ASK.live="";ASK.ctl=null;renderAsk();if(ASK.pendingOpen){const id=ASK.pendingOpen;ASK.pendingOpen=null;openRecipe(id)}try{sessionStorage.setItem("nft-ask",JSON.stringify(ASK.turns.slice(-20)))}catch(x){}}
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="askopen"){ASK.open=true;renderAsk();setTimeout(()=>{const i=$("#askIn");if(i)i.focus()},50)}
  else if(a==="askclose"){ASK.draft=($("#askIn")||{}).value||"";ASK.open=false;renderAsk()}
  else if(a==="askhide"){setPref("askHidden",true);ASK.open=false;renderAsk();toast("Ask is hidden. Turn it back on in More, Settings.");if(S.view==="more")render()}
  else if(a==="asksug"){askSend(b.textContent)}
  else if(a==="askstop"){if(ASK.ctl)ASK.ctl.abort()}
  else if(a==="asknew"){ASK.turns=[];try{sessionStorage.removeItem("nft-ask")}catch(x){}renderAsk()}
});
document.addEventListener("submit",e=>{if(e.target.id!=="askForm")return;e.preventDefault();askSend($("#askIn").value)});
document.addEventListener("keydown",e=>{if(e.target.id==="askIn"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();askSend(e.target.value)}});
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.askshow!=null){setPref("askHidden",!e.target.checked);renderAsk()}});
try{ASK.turns=JSON.parse(sessionStorage.getItem("nft-ask")||"[]")}catch(e){}
renderAsk();
(async()=>{if(!window.claude||!window.claude.use){ASK.ready=true;ASK.err="opened outside Claude";renderAsk();return}try{ASK.fn=await window.claude.use("sample")}catch(e){ASK.fn=null;ASK.err=String(e&&e.code||"")}
  if(ASK.fn){try{const l=await ASK.fn.limits();ASK.tools=!!(l&&l.tools)}catch(e){ASK.tools=false}}
  ASK.ready=true;renderAsk();if(S.view==="more"||(S.view==="money"&&!S.spForm))render()})();
</script>

<script>
/* Android app: in-app updates.
   Inside Claude, the web app checks for updates through Claude's shared
   database. The Android app has none, so this replaces that check with one
   that asks the Android updater, which downloads only the files that changed. */
(function () {
  var A = window.NFTAndroid;
  if (!A || !A.updateStatus || typeof UPD === "undefined") return;

  var info = {};
  try { info = JSON.parse(A.updateStatus()) || {}; } catch (e) {}
  var ST = { manual: false, progress: null, err: "" };

  function onSettings() { return S.view === "more" && (S.moreSub || "shop") === "settings"; }
  function refresh() { try { showUpdBar(); if (onSettings()) render(); } catch (e) {} }
  function niceDate(iso) {
    var d = iso ? new Date(iso + "T12:00:00") : null;
    return d && !isNaN(d) ? d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "";
  }
  function busy() { return UPD.state === "checking" || UPD.state === "installing" || UPD.state === "downloading-app"; }

  /* Messages from the Android updater. */
  window.__nftUpd = function (m) {
    if (!m) return;
    if (m.type === "check") {
      var manual = ST.manual;
      ST.manual = false;
      UPD.checked = Date.now();
      UPD.latest = m.latest || null;
      ST.err = m.message || "";
      UPD.state = m.state; // current | ready | app | error
      if (m.state === "ready" && updPref() && !manual) { installUpdate(); return; }
      refresh();
      if (manual) {
        toast(m.state === "ready" ? "An update is ready"
          : m.state === "app" ? "A new version of the app is ready"
          : m.state === "error" ? (ST.err || "Couldn't check just now")
          : "You have the latest version");
      }
    } else if (m.type === "progress") {
      ST.progress = m;
      if (onSettings()) render();
    } else if (m.type === "installed") {
      try { sessionStorage.setItem("nft-android-updated", String(m.build || "")); } catch (e) {}
      // A fresh address, so the browser can't show a cached copy of the old page.
      location.replace(location.pathname + "?v=" + (m.build || "") + "-" + Date.now());
    } else if (m.type === "app-ready") {
      UPD.state = "app";
      ST.progress = null;
      refresh();
      toast("Tap Install on the next screen to finish");
    } else if (m.type === "error") {
      UPD.state = m.during === "app" ? "app" : "ready";
      ST.progress = null;
      ST.err = m.message || "Something went wrong. Please try again.";
      refresh();
      toast(ST.err);
    }
  };

  /* Replacements for the web app's update functions (same names, so its
     buttons, timers and settings keep working). */
  checkUpdates = function (manual) {
    if (busy() && UPD.state !== "checking") return;
    ST.manual = !!manual;
    UPD.state = "checking";
    if (manual) refresh();
    A.checkForUpdate();
  };

  installUpdate = function () {
    if (S.cook) { UPD.pendingReload = true; toast("The update will install when you finish cooking"); return; }
    UPD.pendingReload = false;
    UPD.state = "installing";
    ST.progress = null;
    refresh();
    A.installUpdate();
  };

  function installApp() {
    UPD.state = "downloading-app";
    ST.progress = null;
    refresh();
    A.installAppUpdate();
  }

  showUpdBar = function () {
    var el = document.getElementById("updBar");
    if (!el) return;
    if (UPD.state === "ready" && !updPref() && !UPD.dismissed) {
      el.innerHTML = '<span>An update is ready' + (UPD.latest && UPD.latest.notes ? ": " + esc(UPD.latest.notes) : "") + '</span>' +
        '<span class="row"><button class="btn small" data-act="updlater">Later</button><button class="btn small primary" data-act="updnow">Install</button></span>';
      el.hidden = false;
    } else if (UPD.state === "app" && !UPD.dismissed) {
      el.innerHTML = '<span>A new version of the app is ready.</span>' +
        '<span class="row"><button class="btn small" data-act="updlater">Later</button><button class="btn small primary" data-act="updapp">Install</button></span>';
      el.hidden = false;
    } else {
      el.hidden = true;
    }
  };

  viewUpdates = function () {
    var L = UPD.latest, s = UPD.state, p = ST.progress;
    var status =
      s === "checking" ? "Checking…" :
      s === "installing" ? (p && p.total ? "Downloading " + p.done + " of " + p.total + (p.total === 1 ? " file…" : " files…") : "Installing…") :
      s === "downloading-app" ? (p && p.bytesTotal ? "Downloading the new app… " + Math.min(100, Math.round(100 * p.bytes / p.bytesTotal)) + "%" : "Downloading the new app…") :
      s === "ready" ? "Update " + esc(String(L && L.build || "")) + " is ready" + (L && L.date ? " (" + esc(niceDate(L.date)) + ")" : "") + "." :
      s === "app" ? "A new version of the app itself is ready. Installing it keeps everything saved in the app." :
      s === "current" ? "You have the latest version." :
      s === "error" ? esc(ST.err || "Couldn't check. You may be offline.") :
      "Not checked yet.";
    var news = (s === "ready" || s === "app") && L && L.notes ? '<br>What\'s in it: ' + esc(L.notes) : "";
    return '<section class="panel"><h2>Updates</h2>' +
      '<div class="verline"><b>Version ' + esc(info.version || "") + ', update ' + esc(String(info.build || "")) + '</b><span class="note">' + esc(niceDate(info.date)) + '</span></div>' +
      (info.notes ? '<p class="note" style="margin:4px 0 10px">What\'s new: ' + esc(info.notes) + '</p>' : '') +
      '<label class="check"><input type="checkbox" data-pref="autoUpdate" ' + (updPref() ? "checked" : "") + '><span>Install updates automatically' +
      '<span class="alt"> · when the app opens, downloading only what changed (never in the middle of a cook-along)</span></span></label>' +
      '<p class="note" style="margin:8px 0">' + status + ' Last checked ' + fmtWhen(UPD.checked) + '.' + news + '</p>' +
      '<div class="row"><button class="btn small" data-act="updcheck"' + (busy() ? " disabled" : "") + '>Check for updates</button>' +
      (s === "ready" ? '<button class="btn small primary" data-act="updnow">Install update</button>' : '') +
      (s === "app" ? '<button class="btn small primary" data-act="updapp">Install new app version</button>' : '') +
      '</div></section>';
  };

  document.addEventListener("click", function (e) {
    var b = e.target.closest('[data-act="updapp"]');
    if (b && !busy()) installApp();
  });

  try {
    var u = sessionStorage.getItem("nft-android-updated");
    if (u) {
      sessionStorage.removeItem("nft-android-updated");
      setTimeout(function () { toast("Update " + u + " installed"); }, 900);
    }
  } catch (e) {}

  UPD.state = "idle";
  setTimeout(function () { checkUpdates(false); }, 1500);
})();
</script>
